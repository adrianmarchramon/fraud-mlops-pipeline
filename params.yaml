# params.yaml — versioned pipeline hyperparameters and parameters.
# Populated starting from Phase 1 (Data Pipeline and Versioning).

preprocess:
  test_size: 0.2
  random_state: 42
  scale_columns:
    - Time
    - Amount

# Versioned training parameters (Phase 2, Step 8). Shared keys apply to every
# run; each model owns a hyperparameter sub-block, so switching `train.model`
# never requires rewriting the rest. resolve_model_params() in
# src/models/train.py flattens the active model's sub-block onto the shared keys
# before build_model() sees them.
#
# `model` is xgboost as of Step 9, chosen on PR-AUC (0.8760, vs 0.7249 for the
# best logistic_regression run) — the primary metric fixed in ADR 0001.
# `threshold` is the cost-optimal operating point measured in Step 10 via
# cost_optimal_threshold() with the `evaluate` costs below: it minimizes
# expected business cost (EUR 1787 on the test split, vs EUR 2240 at the old
# provisional 0.5 and EUR 2885 at the F1-optimal 0.9921). It sits far below 0.5
# because a missed fraud costs ~34x a false alarm, so catching fraud is worth
# many false alarms. It inherits ADR 0002's "illustrative figures" caveat and
# must be re-derived when real cost data exists. Per ADR 0001 it is a versioned
# part of the model artifact, not an API detail — Phase 3 registers it with the
# model.
# `resampling` is mutually exclusive with class weighting per run and is a
# SHARED key: it is honored for logistic_regression (smote disables
# class_weight). xgboost's imbalance knob is scale_pos_weight instead, and it
# silently ignores class_weight, so xgboost MUST pair with resampling=none —
# smote would double-correct (scale_pos_weight AND SMOTE at once). That is why
# activating xgboost in Step 9 flips resampling to none in the same change.
train:
  model: xgboost
  threshold: 0.03
  resampling: none
  random_state: 42
  logistic_regression:
    max_iter: 1000
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.1
    scale_pos_weight: 577.29

# Versioned evaluation parameters (Phase 2, Step 10), consumed as arguments by
# the pure functions in src/models/evaluate.py — which never read this file
# themselves, exactly as compute_metrics() never reads it.
#
# cost_fp / cost_fn come from ADR 0002 (docs/decisions/0002-cost-asymmetry.md),
# which fixes a false negative at ~EUR 137 (EUR 122 mean fraud amount + ~EUR 15
# handling) and a false positive at EUR 3-5; 4.0 is that range's midpoint,
# giving an FN:FP ratio of ~34:1, inside the ~25-50:1 band that ADR records.
# These are ILLUSTRATIVE figures, explicitly not measured business data, so any
# threshold derived from them inherits that caveat — ADR 0002 requires them to
# live here as parameters rather than hardcoded in the code.
evaluate:
  cv_folds: 5
  cost_fp: 4.0
  cost_fn: 137.0

# Versioned parameters for the drift-monitoring reference distribution
# (Phase 8, Step 1), consumed by src/monitoring/reference.py via the
# `reference` stage in dvc.yaml.
#
# The reference is drawn from the TRAINING rows, in RAW feature space, because
# those two properties are what make the comparison mean anything. Training
# rows are the distribution the model actually learned — the thing drift is
# defined against — and raw space is forced by the data on the other side of
# the comparison: the API logs untransformed payloads, while
# data/processed/test.parquet has Time and Amount standardized
# (docs/decisions/0037-reference-dataset.md).
#
# `rows` is a sample, not the full 227,845-row training split: a reference an
# order of magnitude larger than any realistic current window buys no
# statistical power and costs time on every monitoring run. `random_state`
# fixes which rows, so the artifact is byte-reproducible from the DVC-pinned
# CSV. Changing either value re-runs the stage and produces a NEW baseline —
# drift numbers either side of that change are not comparable.
monitoring:
  rows: 5000
  random_state: 42
