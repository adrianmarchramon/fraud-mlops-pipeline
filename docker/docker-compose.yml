# Orchestrates the two services the system needs at serving time (Phase 5).
#
# Two services, not three: the general roadmap mentions an optional logging
# database, but predictions are appended to logs/predictions.jsonl, and
# docs/decisions/0021-prediction-log-and-api-tests.md froze that file's path
# and record shape as a contract with Phase 8. Swapping it for a database now
# would break a phase that has not been written yet.
#
# Image tags are pinned rather than :latest. mlflow matches the 3.14.0 in
# uv.lock so the server and the client library in the API agree — a mismatched
# pair is a real source of registry errors — and a floating tag would sit badly
# beside a committed lockfile and DVC-versioned data.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    # MLflow 3.x validates the Host header of every request as DNS-rebinding
    # protection. Its default allowlist covers loopback and the private IP
    # ranges but NOT container names, so the API's http://mlflow:5000 was
    # answered with "403 Invalid Host header - possible DNS rebinding attack
    # detected" while host-side training over http://localhost:5000 worked.
    # The failure was invisible to the healthcheck because /health and
    # /version are exempt from that validation: the service reported healthy
    # while being unusable for the registry calls that matter.
    #
    # Setting this REPLACES the default list rather than extending it, so both
    # loopback forms are named explicitly — the healthcheck and `make train`
    # against the published port depend on them. No wildcard: "*" switches the
    # protection off entirely instead of naming who may reach the server.
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      # Named volume, not a bind mount: containers are disposable, registered
      # models are not. This survives `docker compose down`.
      - mlflow-data:/mlflow
    healthcheck:
      # Python rather than curl: the official MLflow image is not guaranteed to
      # ship an HTTP CLI, but it necessarily has an interpreter.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      # The repository root, so uv.lock and pyproject.toml are reachable.
      # .dockerignore keeps that context small.
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Tracked template; copy to docker/.env to override locally.
      - .env.example
    depends_on:
      mlflow:
        # Not a bare `depends_on: [mlflow]`, which orders starts but not
        # readiness. The API resolves @production once during lifespan and,
        # by 0020-api-structure-and-state.md, starts anyway on failure without
        # ever retrying — so losing this race leaves a container stuck in
        # no_model until someone restarts it.
        condition: service_healthy

volumes:
  mlflow-data:
