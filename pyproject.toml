[project]
name = "fraud-mlops-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.139.0",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "mlflow>=3",
    "pandas>=2.2,<3",
    "pandera>=0.32.1",
    "pyarrow>=18,<25",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "kaggle>=2.2.3",
    "mypy>=2.2.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.0",
    "prefect>=3.8.4",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# deploy/ holds the exported model artifact (Phase 9). It carries MLflow's own
# snapshot copy of src/, which is part of the frozen model, not of the working
# tree: reformatting it would change the artifact CI verified and the image
# ships. Ruff must not read or rewrite it — and left included, it also drops a
# .ruff_cache inside the bundle.
extend-exclude = ["*.ipynb", "deploy"]  # notebooks are exploration-only, not production code

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "S"]
ignore = [
    "D401",  # imperative-mood first line — too strict for our docstring style
    "N803",  # allow ML argument naming (e.g. X)
    "N806",  # allow ML local-variable naming (e.g. X_train) — sklearn convention
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]  # tests: names self-document; assert is the pytest idiom

[tool.mypy]
# Strict typing has been a declared standard since Phase 0 (see the header
# docstring of every module in src/); this is the section that finally enforces
# it. Configured here rather than passed as CLI flags so `uv run mypy` behaves
# identically on a laptop and on a CI runner — the workflow invokes it bare.
python_version = "3.12"
# Phase 7 extends the scope from src/ to pipelines/. Leaving the new
# orchestration package out would have made "this repository is strictly typed"
# stop being true in the same phase that added a top-level source directory to
# it. Measured cost at the time: zero errors. tests/ remains deliberately out of
# scope (docs/decisions/0026-ci-workflow-shape.md).
#
# Phase 8 adds scripts/ on the same argument: scripts/simulate_drift.py is the
# first file this project has ever placed outside src/ and pipelines/, and
# letting it escape strict typing merely because of where it lives would make
# "this repository is strictly typed" quietly conditional on directory name.
files = ["src", "pipelines", "scripts"]
strict = true

# scikit-learn, imbalanced-learn, joblib and evidently ship no inline types and
# publish no stub package, so every import from them raises an unavoidable
# [import-untyped]. They are silenced BY NAME rather than globally with
# ignore_missing_imports: pandas and PyYAML are genuinely checked (via the
# pandas-stubs and types-PyYAML dev dependencies), and any library that gains
# stubs later starts being checked without anyone editing this file.
#
# evidently 0.7.21 joins the list in Phase 8 — verified rather than assumed:
# site-packages/evidently/ has no py.typed marker, and no types-evidently stub
# package exists. prefect, by contrast, does ship one, which is why it is
# absent here and genuinely type-checked.
[[tool.mypy.overrides]]
module = ["sklearn.*", "imblearn.*", "joblib", "evidently.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
