stages:
  validate:
    cmd: uv run python -m src.data.validate
    deps:
      - src/data/validate.py
      - src/data/ingest.py
      - src/config.py
      - data/raw/creditcard.csv
    outs:
      - reports/validation.json:
          cache: false

  preprocess:
    cmd: uv run python -m src.data.preprocess
    deps:
      - src/data/preprocess.py
      - src/data/ingest.py
      - src/data/validate.py
      - src/config.py
      - data/raw/creditcard.csv
      - reports/validation.json
    params:
      - preprocess.test_size
      - preprocess.random_state
      - preprocess.scale_columns
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - data/processed/preprocessor.joblib

  # Extends the graph from data into the model: dvc repro now rebuilds
  # raw -> validate -> preprocess -> train, re-running only what changed.
  #
  # The two model sub-blocks are declared whole, not as individual leaf keys,
  # because resolve_model_params() splats the entire active sub-block
  # ({**shared, **train_params[active_model]}) — the block itself is the real
  # dependency, and listing it whole also covers hyperparameters added later.
  #
  # metrics: (not outs:) for metrics.json — it is small, structured, readable
  # data meant to live in Git and be compared with `dvc metrics diff`, not a
  # cached binary. The confusion-matrix and PR-curve PNGs are deliberately NOT
  # declared: MLflow already versions them per run, and models/ is overwritten
  # on every run.
  train:
    cmd: uv run python -m src.models.train
    deps:
      - src/models/train.py
      - src/config.py
      - data/processed/train.parquet
      - data/processed/test.parquet
    params:
      - train.model
      - train.threshold
      - train.resampling
      - train.random_state
      - train.logistic_regression
      - train.xgboost
    metrics:
      - reports/metrics.json:
          cache: false

  # Freezes the distribution drift is measured against (Phase 8, Step 1).
  #
  # A separate stage rather than an extra output of `preprocess`, because the
  # two produce different things: preprocess writes the SCALED splits the model
  # trains on, while this writes RAW-space rows to compare against raw API
  # traffic. Bolting it onto preprocess would also make every monitoring-side
  # parameter change invalidate the training data and force a retrain.
  #
  # It is a stage rather than a bare `dvc add`, so the artifact stays inside
  # the graph: change monitoring.rows or the raw CSV and `dvc repro` rebuilds
  # the baseline, exactly as it rebuilds everything else.
  #
  # src/data/preprocess.py is a real dependency, not an incidental import:
  # reference.py reads the split parameters through its load_params() so the
  # reference can never drift from the split the model was trained on.
  reference:
    cmd: uv run python -m src.monitoring.reference
    deps:
      - src/monitoring/reference.py
      - src/data/preprocess.py
      - src/data/ingest.py
      - src/config.py
      - data/raw/creditcard.csv
    params:
      - preprocess.test_size
      - preprocess.random_state
      - monitoring.rows
      - monitoring.random_state
    outs:
      - data/monitoring/reference.parquet
