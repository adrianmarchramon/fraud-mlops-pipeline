repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20  # pinned by `pre-commit autoupdate`
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # pinned by `pre-commit autoupdate`
    hooks:
      # deploy/model/ is an exported MLflow artifact, byte-for-byte as the
      # Registry produced it. These two hooks REWRITE files, and were measured
      # fixing 7 of them (requirements.txt, the input-example JSONs) — a silent
      # edit to a model bundle whose whole value is being identical to the
      # registered version. check-yaml and check-added-large-files only read,
      # so they stay active over it.
      - id: trailing-whitespace
        exclude: ^deploy/model/
      - id: end-of-file-fixer
        exclude: ^deploy/model/
      - id: check-yaml
      # The 1 MB ceiling is the guard that keeps datasets out of Git, so it is
      # not raised. Two paths are excluded instead, each a deliberate, reviewed
      # binary; widening the limit for everything would silently permit the next
      # one nobody looked at.
      #   docs/videos/       the 3.4 MB introduction video
      #   docs/whitepaper.pdf  the 1.2 MB technical paper. Compression was tried
      #     and rejected: ghostscript /ebook reaches 446 KB but visibly smears
      #     the screenshot text, including the "Wasserstein distance (normed)"
      #     column that Figure 4 exists to evidence. /printer fits in 1017 KB
      #     with 7 KB of headroom, which the next edit would exhaust.
      - id: check-added-large-files
        args: [--maxkb=1024]  # EDA notebook is committed with plot outputs (~540 KB)
        exclude: ^docs/(videos/|whitepaper\.pdf$)
